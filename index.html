<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f6f4eb"><meta name="description" content="Um cantinho para conversar com a Capimara.">
 <meta name="referrer" content="no-referrer">
 <title>Capimara — vamos conversar?</title>
 <link rel="icon" href="./site/favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="./site/style.css?v=7">
</head>
<body>
 <header class="topbar">
  <a class="brand" href="./" aria-label="Capimara, início"><img src="./site/favicon.svg" width="38" height="38" alt=""><span>capimara<span class="brand-dot">.</span></span></a>
  <span class="top-note">Uma boa conversa começa com um oi.</span>
  <button id="new-chat" class="quiet-button">Nova conversa <span aria-hidden="true">↗</span></button>
 </header>
 <main class="layout">
  <section id="avatar" class="avatar-panel" aria-label="Capimara em 3D">
   <div class="avatar-heading"><span class="eyebrow">QUE BOM QUE VOCÊ CHEGOU</span><h1>É só falar comigo.</h1></div>
   <div class="capi-stage" aria-label="Arraste para girar a Capimara"></div>
   <div id="loading" class="loading"><span class="loader"></span>Estou chegando…</div>
   <div class="avatar-bottom"><span class="presence"><i></i><span class="capi-status">Preparando a Capimara…</span></span></div>
   <div class="voice-controls" role="region" aria-label="Conversa por voz">
    <div class="scene-tools"><button class="capi-wave pill" title="Pedir um aceno"><span aria-hidden="true">✋</span> Um oi</button><button id="home-camera" class="pill" title="Voltar para o ângulo inicial">↺ <span>Frente</span></button></div>
    <div id="preparation" class="preparation" role="status"><span id="preparation-label">Preparando nossa conversa…</span><progress id="preparation-progress" max="100" value="0" aria-label="Preparação da conversa"></progress></div>
    <div id="activity" class="activity" role="status" hidden><span class="activity-dot"></span><span id="activity-text"></span></div>
    <p id="error" class="error" role="alert" hidden></p>
    <button id="reconnect" class="quiet-button" hidden>Conectar novamente</button>
    <button id="voice-mode" class="voice-button" disabled aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-3 0h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span id="voice-label">Conversar por voz</span><span id="mic-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
    <p id="voice-hint" class="composer-hint">Ative uma vez, permita o microfone e fale comigo.</p>
    <div class="voice-options"><button id="stop" class="quiet-button" hidden>Interromper</button><details id="mic-settings" hidden><summary>Microfone</summary><select id="microphone-device" aria-label="Microfone"><option value="">Padrão do computador</option></select></details></div>
   </div>
  </section>
 </main>
 <footer class="page-footer"><span>Feito para boas conversas.</span><span>Personagem virtual · voz e respostas geradas por IA</span></footer>
 <script type="module" src="./site/main.js?v=7"></script>
</body>
</html>
